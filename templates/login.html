
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at top left,
                    #6366f1,
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    #a855f7,
                    transparent 40%
                ),
                #0f172a;

            overflow: hidden;
        }

        .background-circle {

            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(255,255,255,0.06);

            filter: blur(2px);

        }

        .circle-one {

            top: -150px;
            left: -100px;

        }

        .circle-two {

            bottom: -150px;
            right: -100px;

        }

        .login-container {

            width: 420px;

            padding: 45px;

            background: rgba(255,255,255,0.95);

            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.35);

            position: relative;

            z-index: 2;

            animation: slideUp 0.6s ease;

        }

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .logo {

            width: 60px;
            height: 60px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #9333ea
                );

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            font-size: 28px;

            margin-bottom: 22px;

            box-shadow:
                0 10px 25px rgba(79,70,229,0.35);

        }

        h1 {

            color: #111827;

            font-size: 30px;

            margin-bottom: 8px;

        }

        .subtitle {

            color: #6b7280;

            margin-bottom: 32px;

            line-height: 1.5;

        }

        .input-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            color: #374151;

            margin-bottom: 8px;

        }

        input {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid #d1d5db;

            border-radius: 12px;

            font-size: 15px;

            transition: 0.2s;

        }

        input:focus {

            outline: none;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99,102,241,0.12);

        }

        .login-button {

            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #9333ea
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

            margin-top: 5px;

        }

        .login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(79,70,229,0.35);

        }

        .error {

            background: #fee2e2;

            color: #b91c1c;

            border-radius: 10px;

            padding: 12px;

            margin-bottom: 20px;

            font-size: 14px;

        }

        .demo {

            margin-top: 25px;

            padding: 12px;

            background: #f3f4f6;

            border-radius: 10px;

            color: #6b7280;

            font-size: 13px;

            text-align: center;

        }

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #9ca3af;

            font-size: 12px;

        }

        @media(max-width: 500px) {

            .login-container {

                width: 90%;

                padding: 30px;

            }

        }

    </style>

</head>


<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>


    <div class="login-container">

        <div class="logo">
            ✓
        </div>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Sign in to manage your tasks and track your productivity.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Sign In →
            </button>

        </form>


        <div class="demo">

            Demo account:
            <strong>admin</strong>
            /
            <strong>admin123</strong>

        </div>


        <div class="footer">

            DevOps Task Manager • Flask Application

        </div>

    </div>

</body>

</html>
